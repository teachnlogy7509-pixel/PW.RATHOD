name: Build Android APK
on:
 push:
  branches: [main]
 workflow_dispatch:
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '22'
   - uses: actions/setup-java@v5
     with:
      distribution: temurin
      java-version: '17'
   - name: Use hosted Android SDK
     run: |
      test -d "$ANDROID_HOME"
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.9'
   - run: node scripts/sync-android.mjs
   - run: gradle --no-daemon -p android :app:assembleDebug
   - uses: actions/upload-artifact@v4
     with:
      name: Rathod-Hub-3.0-debug-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 30
